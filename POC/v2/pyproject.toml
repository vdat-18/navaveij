[project]
name = "navaveij"
version = "0.1.0"
description = "AI-powered dashboard for personalized health checkup recommendations"
authors = [
    { name = "Antigravity", email = "antigravity@gemini.ai" }
]
dependencies = [
    "mcp>=0.1.0",
    "loguru>=0.7.2",
    "pydantic>=2.0.0",
    "openai>=2.26.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "baml-py==0.213.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = { find = { where = ["backend"] } }

[tool.ruff]
# Target version for the project
target-version = "py310"
# Line length convention
line-length = 120

[tool.ruff.lint]
# Enable specific rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # pydocstyle
]
# Ignore specific rules if necessary
ignore = [
    "D100", # Missing docstring in public module (handled manually)
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"
